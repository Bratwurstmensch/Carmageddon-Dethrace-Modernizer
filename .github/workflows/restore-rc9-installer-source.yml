name: Restore RC9 installer source

on:
  push:
    branches:
      - release/v1.0-rc1
    paths:
      - ".github/workflows/restore-rc9-installer-source.yml"
      - "installer/rc9-tested-installer.zlib.b64.part1"
      - "installer/rc9-tested-installer.zlib.b64.part2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0-rc1

      - name: Restore and verify exact tested RC9 installer source
        shell: python
        run: |
          import base64
          import hashlib
          import pathlib
          import zlib

          part1 = pathlib.Path("installer/rc9-tested-installer.zlib.b64.part1")
          part2 = pathlib.Path("installer/rc9-tested-installer.zlib.b64.part2")
          target = pathlib.Path("installer/Install-Modernizer.ps1")

          encoded = (
              part1.read_text(encoding="ascii").strip()
              + part2.read_text(encoding="ascii").strip()
          )
          restored = zlib.decompress(base64.b64decode(encoded))

          expected_size = 93080
          expected_sha256 = "4fbe060739a5a1a8fc64958229865f03f91df1e07162e094ddf68db79513cbcd"
          actual_sha256 = hashlib.sha256(restored).hexdigest()

          if len(restored) != expected_size:
              raise SystemExit(
                  f"Unexpected RC9 installer size: {len(restored)} (expected {expected_size})"
              )
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f"Unexpected RC9 installer SHA-256: {actual_sha256}"
              )

          for marker in (b"cue-bin-audio", b"SPLAT PACK.CUE", b"Track02.wav"):
              if marker not in restored:
                  raise SystemExit(f"RC9 marker missing: {marker!r}")

          target.write_bytes(restored)
          print(f"Restored {len(restored)} bytes to {target}")
          print(f"SHA-256: {actual_sha256}")

      - name: Commit restored source when needed
        shell: bash
        run: |
          if git diff --quiet -- installer/Install-Modernizer.ps1; then
            echo "Readable installer source already matches the tested RC9 payload."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/Install-Modernizer.ps1
          git commit -m "Restore exact readable tested RC9 installer source"
          git push origin HEAD:release/v1.0-rc1
