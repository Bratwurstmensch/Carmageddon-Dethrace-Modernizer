name: Restore RC9 installer source

on:
  push:
    branches:
      - release/v1.0-rc1
    paths:
      - ".github/workflows/restore-rc9-installer-source.yml"
      - "installer/rc9-tested-installer.zlib.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0-rc1

      - name: Restore exact tested RC9 installer source
        shell: python
        run: |
          import base64
          import pathlib
          import zlib

          payload = pathlib.Path("installer/rc9-tested-installer.zlib.b64")
          target = pathlib.Path("installer/Install-Modernizer.ps1")

          encoded = "".join(payload.read_text(encoding="ascii").split())
          restored = zlib.decompress(base64.b64decode(encoded))
          target.write_bytes(restored)

          print(f"Restored {len(restored)} bytes to {target}")

      - name: Commit restored source when needed
        shell: bash
        run: |
          if git diff --quiet -- installer/Install-Modernizer.ps1; then
            echo "Readable installer source already matches the tested RC9 payload."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/Install-Modernizer.ps1
          git commit -m "Restore readable tested RC9 installer source"
          git push origin HEAD:release/v1.0-rc1
