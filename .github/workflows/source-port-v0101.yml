name: Validate v1.5 source port

on:
  workflow_dispatch:
  push:
    branches:
      - source-port-v1.5
    paths:
      - "source-port/**"
      - ".github/workflows/source-port-v0101.yml"

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Modernizer
        uses: actions/checkout@v4
        with:
          path: modernizer

      - name: Checkout Dethrace v0.10.1
        uses: actions/checkout@v4
        with:
          repository: dethrace-labs/dethrace
          ref: v0.10.1
          submodules: recursive
          path: dethrace

      - name: Apply Modernizer source port
        run: |
          python modernizer/source-port/apply-v1.5-source-port.py dethrace
          git -C dethrace diff --check
          git -C dethrace diff -- src/DETHRACE/pc-all/allsys.c src/DETHRACE/common/grafdata.c src/DETHRACE/common/loading.c

      - name: Set up Ninja
        uses: aseprite/get-ninja@main

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set up SDL
        uses: libsdl-org/setup-sdl@main
        with:
          add-to-environment: true
          build-type: Release
          cmake-generator: Ninja
          discriminator: x64
          version: 3-latest
          version-sdl2-compat: 2-head
          version-sdl12-compat: 1-head

      - name: Configure
        run: |
          cmake -S dethrace -B dethrace/build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DDETHRACE_PLATFORM_SDL1=ON \
            -DDETHRACE_PLATFORM_SDL2=ON \
            -DDETHRACE_PLATFORM_SDL3=ON \
            -DDETHRACE_PLATFORM_SDL_DYNAMIC=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build dethrace/build --target dethrace

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: dethrace-v0.10.1-modernizer-v1.5-source-port-windows-x64
          path: |
            dethrace/build/**/dethrace.exe
          if-no-files-found: error
