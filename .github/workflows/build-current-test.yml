name: Build current Modernizer test

on:
  push:
    branches:
      - chatgpt/pratcam-directblit-lock-v17-20261003
    paths:
      - "source-port/**"
      - ".github/workflows/build-current-test.yml"

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Modernizer test branch
        uses: actions/checkout@v4
        with:
          path: modernizer

      - name: Checkout Dethrace v0.10.1
        uses: actions/checkout@v4
        with:
          repository: dethrace-labs/dethrace
          ref: v0.10.1
          submodules: recursive
          path: dethrace

      - name: Apply validated v1.5 source port
        run: python modernizer/source-port/apply-v1.5-source-port.py dethrace

      - name: Apply current extended-detail and centering patch
        run: python modernizer/source-port/apply-current-test.py dethrace

      - name: Apply restored draw-distance mirror and cutscene fixes
        run: python modernizer/source-port/apply-current-fixes-v2.py dethrace

      - name: Apply remaining overlay alignment fixes
        run: python modernizer/source-port/apply-overlay-alignment-v3.py dethrace

      - name: Apply final cockpit speed gear and damage alignment
        run: python modernizer/source-port/apply-cockpit-final-overlays-v4.py dethrace

      - name: Fine-tune cockpit instruments and damage overlay
        run: python modernizer/source-port/apply-cockpit-finetune-v5.py dethrace

      - name: Apply measured final cockpit fine-tune
        run: python modernizer/source-port/apply-cockpit-finetune-v6.py dethrace

      - name: Apply final cockpit micro-adjustment
        run: python modernizer/source-port/apply-cockpit-finetune-v7.py dethrace

      - name: Apply cockpit race-start stability guards
        run: python modernizer/source-port/apply-cockpit-stability-v8.py dethrace

      - name: Apply final cockpit visual polish
        run: python modernizer/source-port/apply-cockpit-final-v9.py dethrace

      - name: Apply final hand-only micro-adjustment
        run: python modernizer/source-port/apply-cockpit-final-v10.py dethrace

      - name: Apply cockpit instrument stability v11
        run: python modernizer/source-port/apply-cockpit-stability-v11.py dethrace

      - name: Apply final hand-only micro-adjustment v12
        run: python modernizer/source-port/apply-cockpit-final-v12.py dethrace

      - name: Apply native analog XInput v13
        run: python modernizer/source-port/apply-native-analog-xinput-v13.py dethrace

      - name: Apply cockpit crash diagnostic v14
        run: python modernizer/source-port/apply-cockpit-crashdiag-v14.py dethrace

      - name: Apply Pratcam stability v15
        run: python modernizer/source-port/apply-pratcam-stability-v15.py dethrace

      - name: Apply Pratcam direct-blit v16
        run: python modernizer/source-port/apply-pratcam-directblit-v16.py dethrace

      - name: Apply Pratcam direct-blit lock v17
        run: |
          python modernizer/source-port/apply-pratcam-directblit-lock-v17.py dethrace
          git -C dethrace diff --check

      - name: Set up Ninja
        uses: aseprite/get-ninja@main

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set up SDL
        uses: libsdl-org/setup-sdl@main
        with:
          add-to-environment: true
          build-type: Release
          cmake-generator: Ninja
          discriminator: x64
          version: 3-latest
          version-sdl2-compat: 2-head
          version-sdl12-compat: 1-head

      - name: Configure portable runtime
        run: |
          cmake -S dethrace -B dethrace/build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=OFF \
            -DDETHRACE_INSTALL=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DDETHRACE_PLATFORM_SDL1=ON \
            -DDETHRACE_PLATFORM_SDL2=ON \
            -DDETHRACE_PLATFORM_SDL3=ON \
            -DDETHRACE_PLATFORM_SDL_DYNAMIC=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build dethrace/build --target dethrace

      - name: Install runtime
        run: cmake --install dethrace/build --prefix portable-runtime

      - name: Rename executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath portable-runtime -Filter dethrace.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed dethrace.exe not found" }
          Rename-Item -LiteralPath $exe.FullName -NewName "dethrace-16x9-v1.5.exe"

      - name: Upload test runtime
        uses: actions/upload-artifact@v4
        with:
          name: Carmageddon-Modernizer-Pratcam-DirectBlit-v17-Test
          path: portable-runtime/**
          if-no-files-found: error
