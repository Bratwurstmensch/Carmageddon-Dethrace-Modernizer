name: Validate polished installer

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/installer-polish-rc2-20261004
    paths:
      - "installer/**"
      - ".github/workflows/validate-installer-polish.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "installer\Install-Modernizer.ps1",
            "installer\Uninstall-Modernizer.ps1",
            "installer\controller\Carmageddon-XInput.ps1",
            "installer\controller\Carmageddon-XInput-Native.ps1",
            "installer\controller\Carmageddon-SplatPack-XInput.ps1",
            "installer\controller\Carmageddon-SplatPack-XInput-Native.ps1"
          )) {
            $text = Get-Content -LiteralPath $path -Raw
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $path, $_.Message) }
              throw "PowerShell parse validation failed for $path"
            }
            Write-Host "OK: $path"
          }
